      <rect x="242" y="646" width="66" height="46" rx="14" fill="#f7f9f7" stroke="#dfe6e1"/>
      <text x="275" y="675" fill="#16211b" font-size="15" text-anchor="middle">5</text>
      <rect x="316" y="646" width="54" height="46" rx="14" fill="#f7f9f7" stroke="#dfe6e1"/>
      <text x="343" y="675" fill="#5b6b62" font-size="15" text-anchor="middle">+</text>
