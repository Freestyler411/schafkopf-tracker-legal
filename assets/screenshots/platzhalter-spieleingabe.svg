      <rect x="16" y="573" width="358" height="66" rx="16" fill="#ffffff"/>
      <circle cx="46" cy="606" r="17" fill="#7fd9cc"/>
      <text x="46" y="612" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">V</text>
