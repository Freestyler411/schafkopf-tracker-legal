  <text x="195" y="822" fill="#a8b5ad" font-family="-apple-system, system-ui, sans-serif" font-size="11" letter-spacing="1.2" text-anchor="middle">PLATZHALTER – ECHTER SCREENSHOT FOLGT</text>
