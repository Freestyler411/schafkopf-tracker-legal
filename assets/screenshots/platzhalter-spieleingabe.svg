    <text x="195" y="761" fill="#6b6b70" font-size="13" text-anchor="middle">Erst das Megafon beim Rufer antippen</text>
    <rect x="16" y="774" width="358" height="52" rx="26" fill="#dcdce1"/>
    <text x="195" y="806" fill="#8a8a8e" font-size="17" font-weight="600" text-anchor="middle">Spiel speichern</text>
