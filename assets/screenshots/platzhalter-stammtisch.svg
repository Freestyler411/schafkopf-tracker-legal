    <circle cx="350" cy="42" r="21" fill="#ffffff"/>
    <circle cx="342" cy="42" r="2.4" fill="#1a9a54"/><circle cx="350" cy="42" r="2.4" fill="#1a9a54"/><circle cx="358" cy="42" r="2.4" fill="#1a9a54"/>

