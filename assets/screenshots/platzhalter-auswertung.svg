<?xml version="1.0" encoding="UTF-8"?>
<!--
  SCREENSHOT 3 – „Statistik – Überblick“
  Originalgetreue Nachbildung des Statistik-Bildschirms im Light Mode:
  Bilanz und Ø pro Spiel für fünf Spieler, darunter angeschnitten die
  Siegquote-Karte. Namen und Beträge entsprechen der Vorlage.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="Statistik der Schafkopf-App mit Bilanz und Durchschnittsgewinn pro Spiel für fünf Spieler">
  <rect width="390" height="844" fill="#fdfdfd"/>
  <g font-family="-apple-system, system-ui, sans-serif">

    <!-- Kopfzeile -->
    <circle cx="37" cy="42" r="21" fill="#ffffff"/>
    <path d="M42 34l-8 8 8 8" fill="none" stroke="#16211b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="38" fill="#16211b" font-size="17" font-weight="700" text-anchor="middle">Statistik</text>
    <text x="195" y="57" fill="#8a8a8e" font-size="13" text-anchor="middle">Fr. 3. Juli</text>
    <text x="16" y="106" fill="#16211b" font-size="25" font-weight="700">Überblick</text>

    <!-- ================= Bilanz ================= -->
    <rect x="16" y="126" width="358" height="312" rx="18" fill="#f0f0f5"/>
    <text x="32" y="160" fill="#16211b" font-size="18" font-weight="700">Bilanz</text>

    <g font-size="12">
      <!-- Rasterlinien -->
      <g stroke="#d9d9de" stroke-dasharray="2 3">
        <line x1="98" y1="176" x2="98" y2="400"/>
        <line x1="168" y1="176" x2="168" y2="400"/>
        <line x1="308" y1="176" x2="308" y2="400"/>
      </g>
      <line x1="238" y1="176" x2="238" y2="400" stroke="#c9c9ce"/>
      <g stroke="#e2e2e7">
        <line x1="30" y1="176" x2="360" y2="176"/>
        <line x1="30" y1="220" x2="360" y2="220"/>
        <line x1="30" y1="264" x2="360" y2="264"/>
        <line x1="30" y1="308" x2="360" y2="308"/>
        <line x1="30" y1="352" x2="360" y2="352"/>
        <line x1="30" y1="400" x2="360" y2="400"/>
      </g>

      <!-- Dimmer  +5,25 € -->
      <text x="34" y="192" fill="#8a8a8e">Dimmer</text>
      <rect x="238" y="198" width="74" height="18" rx="2" fill="#34c759"/>
      <text x="318" y="212" fill="#16211b" font-weight="600">+5,25 €</text>

      <!-- Julian  +3,85 € -->
      <text x="34" y="236" fill="#8a8a8e">Julian</text>
      <rect x="238" y="242" width="54" height="18" rx="2" fill="#34c759"/>
      <text x="298" y="256" fill="#16211b" font-weight="600">+3,85 €</text>

      <!-- Adrian  +1,95 € -->
      <text x="34" y="280" fill="#8a8a8e">Adrian</text>
      <rect x="238" y="286" width="27" height="18" rx="2" fill="#34c759"/>
      <text x="271" y="300" fill="#16211b" font-weight="600">+1,95 €</text>

      <!-- Ana  −0,60 € -->
      <text x="34" y="324" fill="#8a8a8e">Ana</text>
      <rect x="229" y="330" width="9" height="18" rx="2" fill="#ff3b30"/>
      <text x="223" y="344" fill="#16211b" font-weight="600" text-anchor="end">−0,60 €</text>

      <!-- Raffi  −10,45 € -->
      <text x="34" y="368" fill="#8a8a8e">Raffi</text>
      <rect x="92" y="374" width="146" height="18" rx="2" fill="#ff3b30"/>
