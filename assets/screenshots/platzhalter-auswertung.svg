        <line x1="30" y1="550" x2="360" y2="550"/>
        <line x1="30" y1="594" x2="360" y2="594"/>
        <line x1="30" y1="638" x2="360" y2="638"/>
        <line x1="30" y1="682" x2="360" y2="682"/>
        <line x1="30" y1="730" x2="360" y2="730"/>
      </g>

      <text x="34" y="522" fill="#8a8a8e">Dimmer</text>
      <rect x="240" y="528" width="60" height="18" rx="2" fill="#34c759"/>
      <text x="306" y="542" fill="#16211b" font-weight="600">+0,14 €</text>

      <text x="34" y="566" fill="#8a8a8e">Julian</text>
      <rect x="240" y="572" width="43" height="18" rx="2" fill="#34c759"/>
      <text x="289" y="586" fill="#16211b" font-weight="600">+0,10 €</text>

      <text x="34" y="610" fill="#8a8a8e">Adrian</text>
      <rect x="240" y="616" width="21" height="18" rx="2" fill="#34c759"/>
      <text x="267" y="630" fill="#16211b" font-weight="600">+0,05 €</text>

      <text x="34" y="654" fill="#8a8a8e">Ana</text>
      <rect x="223" y="660" width="17" height="18" rx="2" fill="#ff3b30"/>
      <text x="217" y="674" fill="#16211b" font-weight="600" text-anchor="end">−0,04 €</text>

      <text x="34" y="698" fill="#8a8a8e">Raffi</text>
      <rect x="94" y="704" width="146" height="18" rx="2" fill="#ff3b30"/>
      <text x="88" y="718" fill="#16211b" font-weight="600" text-anchor="end">−0,34 €</text>

      <g fill="#8a8a8e" text-anchor="middle">
        <text x="68" y="750">-0,4 €</text>
        <text x="154" y="750">-0,2 €</text>
        <text x="240" y="750">0 €</text>
        <text x="326" y="750">0…</text>
      </g>
    </g>

    <!-- ================= Siegquote, angeschnitten ================= -->
    <rect x="16" y="786" width="358" height="90" rx="18" fill="#f0f0f5"/>
    <text x="90" y="822" fill="#16211b" font-size="18" font-weight="700">Siegquote</text>

    <!-- Schwebende Schaltfläche -->
    <circle cx="51" cy="812" r="27" fill="#ffffff" opacity=".96"/>
    <g fill="#1a9a54">
      <rect x="42" y="803" width="7.5" height="7.5" rx="1.8"/>
      <rect x="52.5" y="803" width="7.5" height="7.5" rx="1.8"/>
      <rect x="42" y="813.5" width="7.5" height="7.5" rx="1.8"/>
      <rect x="52.5" y="813.5" width="7.5" height="7.5" rx="1.8"/>
    </g>
  </g>
