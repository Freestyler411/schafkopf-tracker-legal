    <!-- ================= Ø pro Spiel ================= -->
    <rect x="16" y="456" width="358" height="312" rx="18" fill="#f0f0f5"/>
    <text x="32" y="490" fill="#16211b" font-size="18" font-weight="700">Ø pro Spiel</text>

    <g font-size="12">
      <g stroke="#d9d9de" stroke-dasharray="2 3">
