        <line x1="154" y1="506" x2="154" y2="730"/>
        <line x1="326" y1="506" x2="326" y2="730"/>
      </g>
      <line x1="240" y1="506" x2="240" y2="730" stroke="#bcdccb" stroke-width="1.6"/>
