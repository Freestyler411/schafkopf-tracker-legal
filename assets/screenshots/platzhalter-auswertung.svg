<?xml version="1.0" encoding="UTF-8"?>
<!--
  SCREENSHOT 3 – Spielerprofil
  Nachbildung des Spielerprofils im Light Mode: Ring mit gewonnenen und
  verlorenen Spielen, darunter die Verteilung der Spielarten.
  Zahlen entsprechen der Vorlage, der Name ist frei erfunden.

  TODO: Durch echten Screenshot ersetzen (empfohlen 1170 × 2532 px).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="Spielerprofil der Schafkopf-App mit Ringdiagramm zu gewonnenen und verlorenen Spielen sowie der Verteilung der Spielarten">
  <rect width="390" height="844" fill="#fdfdfd"/>
  <g font-family="-apple-system, system-ui, sans-serif">

    <!-- Kopfzeile -->
    <circle cx="37" cy="40" r="21" fill="#ffffff"/>
    <path d="M42 32l-8 8 8 8" fill="none" stroke="#16211b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="47" fill="#16211b" font-size="18" font-weight="700" text-anchor="middle">Sepp</text>
    <circle cx="353" cy="40" r="21" fill="#ffffff"/>
    <circle cx="345" cy="40" r="2.5" fill="#1a9a54"/><circle cx="353" cy="40" r="2.5" fill="#1a9a54"/><circle cx="361" cy="40" r="2.5" fill="#1a9a54"/>

    <!-- ============ Gewonnen / Verloren ============ -->
    <rect x="16" y="76" width="358" height="336" rx="18" fill="#f0f0f5"/>

    <!-- Umfang bei r=80 rund 502,7 – Segmente über stroke-dasharray -->
    <g transform="rotate(-90 195 226)" fill="none" stroke-width="44">
      <circle cx="195" cy="226" r="80" stroke="#34c759" stroke-dasharray="271.4 502.7"/>
      <circle cx="195" cy="226" r="80" stroke="#ff3b30" stroke-dasharray="231.3 502.7" stroke-dashoffset="-271.4"/>
    </g>
    <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="274" y="241">54 %</text>
      <text x="116" y="221">46 %</text>
    </g>
    <text x="195" y="238" fill="#16211b" font-size="38" font-weight="700" text-anchor="middle">319</text>
    <text x="195" y="262" fill="#8a8a8e" font-size="15" text-anchor="middle">Spiele</text>

    <g font-size="14" fill="#3c3c43">
      <circle cx="80" cy="356" r="6" fill="#34c759"/><text x="93" y="361">Gewonnen 171</text>
      <circle cx="212" cy="356" r="6" fill="#ff3b30"/><text x="225" y="361">Verloren 148</text>
    </g>
    <text x="195" y="386" fill="#8a8a8e" font-size="14" text-anchor="middle">Ausgesetzt: 5×</text>

    <!-- ============ Spielarten ============ -->
    <rect x="16" y="430" width="358" height="356" rx="18" fill="#f0f0f5"/>
    <text x="32" y="466" fill="#16211b" font-size="18" font-weight="700">Spielarten</text>

    <!-- Umfang bei r=72 rund 452,4 -->
    <g transform="rotate(-90 195 604)" fill="none" stroke-width="42">
      <circle cx="195" cy="604" r="72" stroke="#2e9e5b" stroke-dasharray="226.2 452.4"/>
      <circle cx="195" cy="604" r="72" stroke="#3b7dd8" stroke-dasharray="77.8 452.4" stroke-dashoffset="-226.2"/>
      <circle cx="195" cy="604" r="72" stroke="#e08b2e" stroke-dasharray="69.3 452.4" stroke-dashoffset="-304.0"/>
      <circle cx="195" cy="604" r="72" stroke="#a855c7" stroke-dasharray="40.2 452.4" stroke-dashoffset="-373.3"/>
      <circle cx="195" cy="604" r="72" stroke="#d94a52" stroke-dasharray="37.5 452.4" stroke-dashoffset="-413.5"/>
      <circle cx="195" cy="604" r="72" stroke="#14b8a6" stroke-dasharray="1.4 452.4" stroke-dashoffset="-451.0"/>
    </g>
    <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="267" y="609">50 %</text>
      <text x="158" y="671">17 %</text>
      <text x="123" y="609">15 %</text>
      <text x="142" y="560">9 %</text>
      <text x="175" y="540">8 %</text>
    </g>

    <g font-size="13" fill="#3c3c43">
      <circle cx="52" cy="724" r="5.5" fill="#2e9e5b"/><text x="64" y="729">Sauspiel 163</text>
      <circle cx="164" cy="724" r="5.5" fill="#3b7dd8"/><text x="176" y="729">Ramsch 56</text>
      <circle cx="266" cy="724" r="5.5" fill="#e08b2e"/><text x="278" y="729">Solo 50</text>
      <circle cx="60" cy="752" r="5.5" fill="#a855c7"/><text x="72" y="757">Hochzeit 29</text>
      <circle cx="168" cy="752" r="5.5" fill="#d94a52"/><text x="180" y="757">Wenz 27</text>
      <circle cx="256" cy="752" r="5.5" fill="#14b8a6"/><text x="268" y="757">Farbwenz 1</text>
    </g>

    <!-- Spielweise, angeschnitten -->
    <text x="90" y="822" fill="#16211b" font-size="21" font-weight="700">Spielweise</text>
    <circle cx="51" cy="812" r="27" fill="#ffffff" opacity=".96"/>
    <g fill="#1a9a54">
      <circle cx="45" cy="806" r="5"/><circle cx="57" cy="808" r="4"/>
      <path d="M37 819c0-5 4-8 8-8s8 3 8 8M53 819c0-4 3-6 6-6s6 2 6 6" fill="none" stroke="#1a9a54" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
